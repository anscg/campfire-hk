<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <title>secret admin view</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <style>
            /* Flash prevention: hide body by default until password check passes */
            body {
                display: none;
            }
        </style>
    </head>
    <body>
        <script>
            // prompt is a blocking operation, preventing the rest of the DOM from being parsed/rendered
            if (prompt("Enter admin password:") === "campfire@2026") {
                document.body.style.display = "block";
            } else {
                window.location.href = "/";
            }
        </script>

        <h1>do not refresh this page</h1>
        <h3>or you will lose all in-review messages</h3>

        <form id="form">
            <input type="text" name="message" />
        </form>

        <button id="refresh">Refresh display</button>

        <ul id="list"></ul>

        <script src="/socket.io/socket.io.js"></script>
        <script>
            if (document.body.style.display !== "block") {
                throw new Error("Unauthorized");
            }

            const socket = io();

            const list = document.getElementById("list");

            socket.on("messageForReview", (message) => {
                const item = document.createElement("li");
                item.appendChild(document.createTextNode(message));

                const acceptButton = document.createElement("button");
                const rejectButton = document.createElement("button");

                acceptButton.innerText = "Accept!";
                acceptButton.addEventListener("click", () => {
                    socket.emit("acceptMessage", message);
                    item.remove();
                });

                rejectButton.innerText = "Reject";
                rejectButton.addEventListener("click", () => {
                    item.remove();
                });

                item.appendChild(acceptButton);
                item.appendChild(rejectButton);

                list.appendChild(item);
            });

            document.getElementById("form").addEventListener("submit", (e) => {
                e.preventDefault();
                socket.emit("acceptMessage", e.target.message.value.trim());
                e.target.reset();
            });

            document.getElementById("refresh").addEventListener("click", () => {
                socket.emit("refresh");
            });
        </script>
    </body>
</html>
